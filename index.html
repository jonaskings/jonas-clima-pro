        {id:'c2', name:'Carlos Ruiz', phone:'611 234 567', address:'Av. del Sol 48, Madrid', equipment:'Caldera de gas'},

    const copy = (value) => JSON.parse(JSON.stringify(value));
    let state; try { state = JSON.parse(localStorage.getItem('jonas-clima-pro')) || copy(defaults); } catch { state = copy(defaults); }
    if (!Array.isArray(state.invoices)) state.invoices = [];

    let activeTab = 'agenda'; let modalType = null; let modalPreset = {}; let invoiceDraftLines = []; let cloudOrders = []; let stopCloudOrders = null; let cloudInvoices = []; let stopCloudInvoices = null; let cloudClaims = []; let stopCloudClaims = null; let cloudAvailability = []; let stopCloudAvailability = null; let cloudUser = null;

      document.documentElement.style.setProperty('--wallpaper', backgrounds[state.settings.background] || backgrounds.claro);
      document.querySelector('.app').classList.toggle('text-large', state.settings.textSize === 'large');

      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));

    }
    function renderAgenda() {

    function bindDetails() { document.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', () => showDetail(el.dataset.detail, el.dataset.id))); }
    function showDetail(kind, id) {
      const collection = kind === 'appointment' ? [...state.appointments, ...cloudOrders] : kind === 'invoice' ? [...cloudInvoices, ...state.invoices] : kind === 'claim' ? [...cloudClaims, ...state.claims] : state[kind === 'client' ? 'clients' : 'diagnostics'];
      const item = collection.find(i => i.id === id);
      if (!item) return;
      if (kind === 'invoice') { showInvoicePreview(item); return; }
      const invoiceLines=(item.items||[]).map(line=>`${line.description}: ${line.quantity} × ${Number(line.unitPrice||0).toLocaleString('es-DO',{style:'currency',currency:'DOP'})}`).join('\n');
      const details = kind === 'appointment' ? `${item.service} · ${item.time}${item.endTime?` a ${item.endTime}`:''}\nEstado: ${item.status}${item.phone ? `\nTeléfono: ${item.phone}` : ''}${item.equipmentBtu ? `\nBTU del aire: ${item.equipmentBtu}` : ''}${item.equipmentVoltage ? `\nVoltaje del aire: ${item.equipmentVoltage}` : ''}${item.address ? `\n\nDirección: ${item.address}\nVivienda: ${item.housingType || 'No especificada'}${item.propertyLevel ? `\nNivel: ${item.propertyLevel}` : ''}${item.housingDetails ? `\nDetalles: ${item.housingDetails}` : ''}` : ''}` : kind === 'client' ? `${item.phone}\n${item.address || 'Dirección no registrada'}\nEquipo: ${item.equipment || 'Sin registrar'}` : kind === 'diagnostic' ? `${item.equipment || 'Equipo no indicado'}\n\n${item.result}` : kind === 'invoice' ? `${item.number}${item.ncf?`\nNCF: ${item.ncf}`:''}\n\n${invoiceLines||item.concept}\n\nSubtotal: ${Number(item.subtotal ?? item.amount ?? 0).toLocaleString('es-DO',{style:'currency',currency:'DOP'})}\nDescuento: ${Number(item.discount||0).toLocaleString('es-DO',{style:'currency',currency:'DOP'})}\nITBIS (${Number(item.itbisRate||0)}%): ${Number(item.itbis||0).toLocaleString('es-DO',{style:'currency',currency:'DOP'})}\nTotal: ${Number(item.amount||0).toLocaleString('es-DO',{style:'currency',currency:'DOP'})}\nMétodo de pago: ${item.paymentMethod||'Pendiente'}${item.dueDate?`\nVence: ${item.dueDate}`:''}${item.notes?`\n\nNotas: ${item.notes}`:''}\nEstado: ${item.status}` : `${item.subject}\n\n${item.description}\n\nEstado: ${item.status}`;
      alert(`${item.client || item.name}\n\n${details}`);
    }
    function showInvoicePreview(f){const currency=new Intl.NumberFormat('es-DO',{style:'currency',currency:'DOP'});const lines=(f.items||[]).length?f.items:[{description:f.concept||'Servicio de refrigeración',quantity:1,unitPrice:Number(f.amount)||0}];const body=document.getElementById('invoicePreviewBody');body.innerHTML=`<article class="invoice-card"><div class="invoice-business"><img src="jonas-clima-pro-icon.png" alt=""><span><strong>Jonas Clima Pro</strong><small>Técnico en refrigeración<br>829-862-5380</small></span><span class="invoice-number"><small>FACTURA</small><strong>${escape(f.number)}</strong></span></div><div class="invoice-meta" style="margin-top:14px"><span><small>CLIENTE</small><strong>${escape(f.client)}</strong><span>${escape(f.phone||'')}</span>${f.address?`<span>${escape(f.address)}</span>`:''}</span><span><small>FECHA</small><strong>${escape(f.date)}</strong>${f.ncf?`<span>NCF: ${escape(f.ncf)}</span>`:''}${f.dueDate?`<span>Vence: ${escape(f.dueDate)}</span>`:''}</span></div><div class="invoice-table"><div class="invoice-row head"><span>Concepto</span><span>Cant.</span><span>Precio</span><span>Importe</span></div>${lines.map(line=>`<div class="invoice-row"><span>${escape(line.description)}</span><span>${escape(line.quantity)}</span><span>${currency.format(Number(line.unitPrice)||0)}</span><span>${currency.format((Number(line.quantity)||0)*(Number(line.unitPrice)||0))}</span></div>`).join('')}</div><div class="invoice-totals"><span>Subtotal</span><strong>${currency.format(Number(f.subtotal??f.amount)||0)}</strong>${Number(f.discount)?`<span>Descuento</span><strong>− ${currency.format(Number(f.discount))}</strong>`:''}<span>ITBIS (${Number(f.itbisRate)||0}%)</span><strong>${currency.format(Number(f.itbis)||0)}</strong><span class="grand">TOTAL</span><strong class="grand">${currency.format(Number(f.amount)||0)}</strong></div><p class="sub" style="margin-top:18px"><b>Método de pago:</b> ${escape(f.paymentMethod||'Pendiente')}<br><b>Estado:</b> ${['Pago','Pagada'].includes(f.status)?'Pago':'Pendiente'}${f.notes?`<br><b>Notas:</b> ${escape(f.notes)}`:''}</p></article>`;document.getElementById('invoicePreviewWrap').classList.add('show');document.getElementById('invoicePreviewWrap').setAttribute('aria-hidden','false');document.getElementById('printInvoicePreview').dataset.invoiceId=f.id}
    function closeInvoicePreview(){const wrap=document.getElementById('invoicePreviewWrap');wrap.classList.remove('show');wrap.setAttribute('aria-hidden','true')}
    const fields = {
      appointment: [['client','Cliente *','Nombre del cliente','text'],['date','Día *','Selecciona una fecha','date'],['time','Hora *','Ej. 10:30','time'],['service','Tipo de servicio *','Mantenimiento, reparación...','text']],
      availability: [['date','Día disponible *','Selecciona una fecha','date'],['time','Hora disponible *','Selecciona una hora','time']],
      session: [['email','Correo del administrador *','8298625380mr@gmail.com','email'],['password','Contraseña *','Tu contraseña segura','password']],
      client: [['name','Nombre completo *','Ej. Laura Sánchez','text'],['phone','Teléfono *','600 000 000','tel'],['address','Dirección','Calle, número, ciudad','text'],['equipment','Equipo / instalación','Ej. Aire acondicionado Split','text'],['nextVisit','Próxima visita','Selecciona una fecha','date']],
      diagnostic: [['client','Cliente *','Nombre del cliente','text'],['equipment','Equipo','Equipo revisado','text'],['result','Resultado *','Conclusión y acciones recomendadas','textarea']],
      invoice: [['client','Cliente *','Nombre del cliente','text'],['phone','Teléfono del cliente','Ej. 829-000-0000','tel'],['address','Dirección','Dirección del cliente','text'],['ncf','NCF / comprobante fiscal','Opcional','text'],['dueDate','Fecha de vencimiento','Selecciona una fecha','date'],['paymentMethod','Método de pago','Efectivo, transferencia o tarjeta','text'],['discount','Descuento (RD$)','0.00','number'],['notes','Notas','Garantía, condiciones u observaciones','textarea']],
      claim: [['client','Cliente *','Nombre del cliente','text'],['subject','Asunto *','Ej. Incidencia con la instalación','text'],['description','Detalle *','Describe la reclamación','textarea']]
    };
    function openModal(type, preset = {}) {
      modalType = type; modalPreset = preset; const titles = {appointment:'Nueva cita',availability:'Publicar disponibilidad',client:'Nuevo cliente',diagnostic:'Nuevo diagnóstico',invoice:'Crear factura',claim:'Nueva reclamación',session:'Conectar agenda'}; document.getElementById('modalTitle').textContent = titles[type];
      form.innerHTML = fields[type].map(([name,label,placeholder,input]) => `<div class="field"><label for="${name}">${label}</label>${input === 'textarea' ? `<textarea id="${name}" name="${name}" placeholder="${placeholder}"></textarea>` : `<input id="${name}" name="${name}" type="${input}" placeholder="${placeholder}">`}</div>`).join('') + (type === 'session' ? '<button class="action-button secondary" id="resetPasswordButton" type="button">Olvidé mi contraseña</button>' : '');
      Object.entries(preset).forEach(([name,value]) => { const input=form.elements.namedItem(name); if(input) input.value=value || ''; });
      if (type === 'invoice') {
        invoiceDraftLines=(preset.lines||[{description:'',quantity:1,unitPrice:0}]).map(item=>({...item}));
        form.insertAdjacentHTML('beforeend','<div class="field"><label>Servicios y materiales *</label><div id="invoiceLines"></div><button class="action-button secondary" id="addInvoiceLine" type="button">+ Agregar concepto</button></div><label class="checkbox-field"><input id="applyItbis" name="applyItbis" type="checkbox"> Aplicar ITBIS (18%)</label><div class="invoice-summary" id="invoiceSummary"></div>');
        document.getElementById('addInvoiceLine').addEventListener('click',()=>{invoiceDraftLines.push({description:'',quantity:1,unitPrice:0});renderInvoiceLines()});
        document.getElementById('applyItbis').addEventListener('change',updateInvoiceSummary);
        renderInvoiceLines();
      }
      if (type === 'session') {
        document.getElementById('email').value = '8298625380mr@gmail.com';
        document.getElementById('resetPasswordButton').addEventListener('click', resetAdminPassword);
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); setTimeout(()=>{const first=form.querySelector('input,textarea');first?.focus();if((type==='appointment'||type==='availability')&&form.querySelector('[type="date"]')?.showPicker)form.querySelector('[type="date"]').showPicker()},100);
    }
    function invoiceTotals() {
      const subtotal=invoiceDraftLines.reduce((sum,item)=>sum+(Number(item.quantity)||0)*(Number(item.unitPrice)||0),0);
      const discount=Math.max(Number(document.getElementById('discount')?.value)||0,0);
      const taxable=Math.max(subtotal-discount,0);
      const itbisRate=document.getElementById('applyItbis')?.checked?18:0;
      const itbis=taxable*itbisRate/100;
      return {subtotal,discount,itbisRate,itbis,total:taxable+itbis};
    }
    function updateInvoiceSummary(){const box=document.getElementById('invoiceSummary');if(!box)return;const t=invoiceTotals();const money=value=>Number(value||0).toLocaleString('es-DO',{style:'currency',currency:'DOP'});box.innerHTML=`Subtotal <strong>${money(t.subtotal)}</strong><br>Descuento <strong>− ${money(t.discount)}</strong><br>ITBIS (${t.itbisRate}%) <strong>${money(t.itbis)}</strong><br>Total <strong>${money(t.total)}</strong>`}
    function renderInvoiceLines(){const wrap=document.getElementById('invoiceLines');if(!wrap)return;wrap.innerHTML=invoiceDraftLines.map((item,index)=>`<div class="invoice-line"><div class="invoice-line-grid"><div class="field"><label>Descripción</label><input data-line-description="${index}" value="${escape(item.description)}" placeholder="Servicio, pieza o material"></div><div class="field"><label>Cantidad</label><input data-line-quantity="${index}" type="number" min="0.01" step="0.01" value="${Number(item.quantity)||1}"></div><div class="field"><label>Precio unitario RD$</label><input data-line-price="${index}" type="number" min="0" step="0.01" value="${Number(item.unitPrice)||0}"></div></div>${invoiceDraftLines.length>1?`<button class="invoice-line-remove" data-remove-line="${index}" type="button">Quitar concepto</button>`:''}</div>`).join('');wrap.querySelectorAll('[data-line-description]').forEach(input=>input.addEventListener('input',()=>{invoiceDraftLines[Number(input.dataset.lineDescription)].description=input.value}));wrap.querySelectorAll('[data-line-quantity]').forEach(input=>input.addEventListener('input',()=>{invoiceDraftLines[Number(input.dataset.lineQuantity)].quantity=input.value;updateInvoiceSummary()}));wrap.querySelectorAll('[data-line-price]').forEach(input=>input.addEventListener('input',()=>{invoiceDraftLines[Number(input.dataset.linePrice)].unitPrice=input.value;updateInvoiceSummary()}));wrap.querySelectorAll('[data-remove-line]').forEach(button=>button.addEventListener('click',()=>{invoiceDraftLines.splice(Number(button.dataset.removeLine),1);renderInvoiceLines()}));document.getElementById('discount')?.addEventListener('input',updateInvoiceSummary);updateInvoiceSummary()}
    async function resetAdminPassword() {
      if (!window.jonasCloud) { toast('La conexión no está disponible'); return; }
      const email = document.getElementById('email').value.trim();
      if (!email) { toast('Escribe el correo del administrador'); return; }
      try { await jonasCloud.auth.sendPasswordResetEmail(email); toast('Enlace enviado. Revisa tu correo.'); }
      catch { toast('No se pudo enviar el enlace de recuperación'); }
    }
    function closeModal() { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); modalType=null; }
    async function save() {
      const data = Object.fromEntries(new FormData(form));
      if (modalType === 'session') {
        if (!data.email || !data.password) { toast('Escribe tu correo y contraseña'); return; }
        try {
          await jonasCloud.auth.signInWithEmailAndPassword(data.email.trim(), data.password);
          closeModal(); toast('Agenda conectada');
        } catch (error) {
          if (error.code === 'auth/user-not-found') {
            try { await jonasCloud.auth.createUserWithEmailAndPassword(data.email.trim(), data.password); closeModal(); toast('Cuenta de administrador creada'); } catch { toast('No se pudo crear la cuenta. Revisa tus datos.'); }
          } else toast('No se pudo iniciar sesión. Revisa tus datos.');
        }
        return;
      }
      if(modalType==='availability'){if(!data.date||!data.time){toast('Elige el día y la hora');return}if(!window.jonasCloud||!cloudUser){toast('Conecta la agenda primero');return}try{await jonasCloud.db.collection('availability').add({date:data.date,time:data.time,status:'available',createdAt:jonasCloud.firebase.firestore.FieldValue.serverTimestamp()});closeModal();toast('Horario publicado para los clientes')}catch{toast('No se pudo publicar el horario')}return}
      const required = modalType === 'client' ? ['name','phone'] : modalType === 'appointment' ? ['client','date','time','service'] : modalType === 'diagnostic' ? ['client','result'] : modalType === 'invoice' ? ['client'] : ['client','subject','description'];
      if (required.some(key => !String(data[key] || '').trim())) { toast('Completa los campos marcados con *'); return; }
      const id = String(Date.now());
      if (modalType === 'client') state.clients.unshift({id,...data});
      if (modalType === 'appointment') state.appointments.push({id,...data,status:'Pendiente'});
      if (modalType === 'diagnostic') state.diagnostics.unshift({id,...data,date:'Hoy'});
      if (modalType === 'invoice') {
        const lines=invoiceDraftLines.map(item=>({description:String(item.description||'').trim(),quantity:Number(item.quantity)||0,unitPrice:Number(item.unitPrice)||0})).filter(item=>item.description&&item.quantity>0);
        if(!lines.length){toast('Agrega por lo menos un concepto a la factura');return}
        invoiceDraftLines=lines;const totals=invoiceTotals();const concept=lines.map(item=>item.description).join(' + ');
        const invoice = {id,number:`F-${new Date().getFullYear()}-${String(state.invoices.length + cloudInvoices.length + 1).padStart(3,'0')}`,client:data.client,phone:data.phone || modalPreset.phone || '',address:data.address||'',ncf:data.ncf||'',dueDate:data.dueDate||'',paymentMethod:data.paymentMethod||'Pendiente',notes:data.notes||'',items:lines,concept,subtotal:totals.subtotal,discount:totals.discount,itbisRate:totals.itbisRate,itbis:totals.itbis,amount:totals.total,status:'Pendiente',date:new Date().toLocaleDateString('es-DO')};
        if (modalPreset.clientId && window.jonasCloud && cloudUser) {
          try { await jonasCloud.db.collection('invoices').add({...invoice,clientId:modalPreset.clientId,orderId:modalPreset.orderId || '',createdAt:jonasCloud.firebase.firestore.FieldValue.serverTimestamp()}); closeModal(); render(); toast('Factura enviada al cliente'); return; }
          catch { toast('No se pudo sincronizar la factura'); return; }
        }
        state.invoices.unshift(invoice);
      }
      if (modalType === 'claim') state.claims.unshift({id,...data,status:'Pendiente',date:'Hoy'});
      persist(); closeModal(); render(); toast(modalType === 'client' ? 'Cliente añadido' : modalType === 'appointment' ? 'Cita agendada' : modalType === 'diagnostic' ? 'Diagnóstico guardado' : modalType === 'invoice' ? 'Factura creada' : 'Reclamación registrada');
    }
    let toastTimer; function toast(message) { const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }
    document.querySelectorAll('.tab').forEach(button => button.addEventListener('click',()=>{ activeTab=button.dataset.tab; render(); }));
    document.getElementById('headerSettings').addEventListener('click',()=>{ activeTab='settings'; render(); });
    document.getElementById('addButton').addEventListener('click',()=>openModal(activeTab === 'agenda' ? 'appointment' : activeTab === 'clients' ? 'client' : activeTab === 'diagnostics' ? 'diagnostic' : activeTab === 'invoices' ? 'invoice' : 'claim'));
    document.getElementById('cancelButton').addEventListener('click',closeModal); document.getElementById('saveButton').addEventListener('click',save);
    modal.addEventListener('click',e=>{if(e.target === modal) closeModal();});
    document.getElementById('closeInvoicePreview').addEventListener('click',closeInvoicePreview); document.getElementById('printInvoicePreview').addEventListener('click',event=>printInvoice(event.currentTarget.dataset.invoiceId)); document.getElementById('invoicePreviewWrap').addEventListener('click',event=>{if(event.target===event.currentTarget)closeInvoicePreview()});
    function cloudOrderToAppointment(doc) {
      const order = doc.data();
      return { id:`cloud-${doc.id}`, remoteId:doc.id, clientId:order.clientId || '', client:order.clientName || 'Cliente', phone:order.clientPhone || '', date:order.preferredDate || '', time:order.preferredTime || 'Por coordinar', endTime:order.endTime||'', lockIds:order.lockIds||[], service:(order.items || []).map(item => item.name).join(' + ') || 'Servicio solicitado', items:order.items||[], total:Number(order.total)||0, address:order.clientAddress || '', housingType:order.housingType || '', propertyLevel:order.propertyLevel || '', housingDetails:order.housingDetails || '', equipmentBtu:order.equipmentBtu || '', equipmentVoltage:order.equipmentVoltage || '', status:order.status==='Confirmada'?'Recibido':order.status || 'Pendiente' };
    }
    async function refreshCloudOrders(showMessage = false) {
      if (!window.jonasCloud || !cloudUser) { if (showMessage) toast('Conecta la agenda primero'); return; }
      try {
        const snapshot = await jonasCloud.db.collection('orders').get();
        cloudOrders = snapshot.docs.map(cloudOrderToAppointment);
        if (activeTab === 'agenda') render();
        if (showMessage) toast('Pedidos actualizados');
      } catch { if (showMessage) toast('No se pudieron actualizar los pedidos'); }
    }
    function startCloudOrders() {
      if (!window.jonasCloud || !cloudUser) return;
      stopCloudOrders?.();
      stopCloudOrders = jonasCloud.db.collection('orders').onSnapshot(snapshot => {
        cloudOrders = snapshot.docs.map(cloudOrderToAppointment);
        render();
      }, () => { cloudOrders = []; if (activeTab === 'agenda') render(); });
    }
    function cloudInvoice(doc) { const item=doc.data(); return {id:`cloud-invoice-${doc.id}`,remoteId:doc.id,...item}; }
    function startCloudInvoices() {
      stopCloudInvoices?.();
      stopCloudInvoices = jonasCloud.db.collection('invoices').onSnapshot(snapshot=>{cloudInvoices=snapshot.docs.map(cloudInvoice);if(activeTab==='invoices')render();},()=>{cloudInvoices=[];if(activeTab==='invoices')render();});
    }
    function startCloudClaims() {
      stopCloudClaims?.();
      stopCloudClaims = jonasCloud.db.collection('claims').onSnapshot(snapshot=>{cloudClaims=snapshot.docs.map(doc=>({id:`cloud-claim-${doc.id}`,remoteId:doc.id,...doc.data()}));if(activeTab==='claims')render();},()=>{cloudClaims=[];if(activeTab==='claims')render();});
    }
    function startCloudAvailability() {
      stopCloudAvailability?.();
      stopCloudAvailability = jonasCloud.db.collection('availability').onSnapshot(snapshot=>{cloudAvailability=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));if(activeTab==='agenda')render();},()=>{cloudAvailability=[];if(activeTab==='agenda')render();});
    }
    if (window.jonasCloud) jonasCloud.auth.onAuthStateChanged(user => { cloudUser = user; if (user) { startCloudOrders(); startCloudInvoices(); startCloudClaims(); startCloudAvailability(); } else { stopCloudOrders?.(); stopCloudOrders=null; cloudOrders=[]; stopCloudInvoices?.(); stopCloudInvoices=null; cloudInvoices=[]; stopCloudClaims?.(); stopCloudClaims=null; cloudClaims=[]; stopCloudAvailability?.(); stopCloudAvailability=null; cloudAvailability=[]; } if (activeTab === 'settings' || activeTab === 'agenda' || activeTab === 'invoices' || activeTab === 'claims') render(); });
    window.addEventListener('focus', () => refreshCloudOrders(false));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshCloudOrders(false); });
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
    applyTheme();
    render();
  </script>
